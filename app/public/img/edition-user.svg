<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="نسخة المستخدم">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#EFE6D3"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C2338"/><stop offset="1" stop-color="#551625"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.1" fill="#C5A059" opacity=".35"/></pattern>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#3D2314" flood-opacity=".22"/></filter>
  </defs>
  <rect width="480" height="320" fill="url(#bg)"/>
  <rect width="480" height="320" fill="url(#dots)"/>
  <!-- نافذة البرنامج -->
  <g filter="url(#sh)">
