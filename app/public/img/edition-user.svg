  <!-- الناتج: PDF و Word -->
  <g>
    <rect x="118" y="140" width="92" height="52" rx="9" fill="#6B1D2F"/>
    <text x="164" y="173" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#FBF8F1">PDF</text>
    <rect x="118" y="204" width="92" height="52" rx="9" fill="#274472"/>
    <text x="164" y="237" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#FBF8F1">Word</text>
    <path d="M222 197h-8M218 192l-5 5 5 5" stroke="#C5A059" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- شارة التنزيل -->
  <g transform="translate(398 258)"><circle r="26" fill="#C5A059"/><circle r="26" fill="none" stroke="#fff" stroke-width="3"/><path d="M0-11v16M-7-1l7 7 7-7M-9 12h18" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
