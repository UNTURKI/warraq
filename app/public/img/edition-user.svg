    <path d="M70 56a14 14 0 0 1 14-14h312a14 14 0 0 1 14 14v22H70z" fill="url(#bar)"/>
    <rect x="70" y="76" width="340" height="3" fill="#C5A059"/>
    <circle cx="92" cy="60" r="5" fill="#E7C98A"/><circle cx="109" cy="60" r="5" fill="#E7C98A" opacity=".65"/><circle cx="126" cy="60" r="5" fill="#E7C98A" opacity=".4"/>
    <rect x="290" y="54" width="98" height="12" rx="6" fill="#fff" opacity=".2"/>
  </g>
  <!-- شريط البحث -->
  <rect x="94" y="96" width="292" height="26" rx="13" fill="#F3EFE6" stroke="#e4dccb"/>
  <circle cx="368" cy="109" r="5.5" fill="none" stroke="#6B1D2F" stroke-width="2"/><path d="M364 113l-4.5 4.5" stroke="#6B1D2F" stroke-width="2" stroke-linecap="round"/>
  <rect x="250" y="105" width="100" height="8" rx="4" fill="#d9cfbc"/>
