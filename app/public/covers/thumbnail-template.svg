<?xml version="1.0" encoding="UTF-8"?>
<!--
  قالب «الصورة الخارجية» لتصاميم الأغلفة — استوديو الأغلفة / ورّاق
  ─────────────────────────────────────────────────────────────
  • المقاس: 1024 × 1024 بكسل (مربع). نصف قطر الزوايا 180 (≈ 17.6٪)، وهو نفس ما يعرضه المعرض.
  • المعرض يقص الصورة بزوايا دائرية تلقائياً؛ فلا بأس إن صدّرتها مربعة كاملة.
  • المنطقة الآمنة: داخل 72 بكسل من كل حافة (طبقة «أدلة» مخفية؛ أظهرها أثناء التصميم).
  • غيّر الألوان الثلاثة في <style> أعلاه: ‎.base (الأساس) و ‎.accent (الزخرفة) و ‎.ink (النص)، أو لوّن الأشكال مباشرة.
  • صدّر PNG أو WEBP (أو SVG بلا سكربتات) ثم ارفعه من: لوحة المالك ← التصميم ← الإعدادات ← الصورة الخارجية.
  • الطبقات مسماة لتظهر في Illustrator و Inkscape و Figma.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="1024" height="1024" viewBox="0 0 1024 1024">
  <style>
    .base { fill: #1f3a5f; }
    .accent-f { fill: #c9a54a; }
    .accent-s { fill: none; stroke: #c9a54a; }
    .ink { fill: #f5efe0; }
    .title { font-family: Amiri, "Noto Naskh Arabic", "Traditional Arabic", serif; font-weight: 700; font-size: 96px; }
  </style>
  <defs>
    <clipPath id="round"><rect width="1024" height="1024" rx="180"/></clipPath>
    <radialGradient id="light" cx="50%" cy="28%" r="75%">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </radialGradient>
    <pattern id="stars" width="128" height="128" patternUnits="userSpaceOnUse">
      <path d="M0,-34 L9,-13 L32,-14 L15,2 L24,24 L0,12 L-24,24 L-15,2 L-32,-14 L-9,-13Z" transform="translate(64 64)" class="accent-s" stroke-width="3" opacity=".22"/>
      <circle cx="0" cy="0" r="6" class="accent-f" opacity=".2"/>
      <circle cx="128" cy="128" r="6" class="accent-f" opacity=".2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <g clip-path="url(#round)">
    <!-- ١) الخلفية -->
    <g id="background" inkscape:groupmode="layer" inkscape:label="١ الخلفية — Background">
      <rect width="1024" height="1024" class="base"/>
      <rect width="1024" height="1024" fill="url(#stars)"/>
      <rect width="1024" height="1024" fill="url(#light)"/>
    </g>

    <!-- ٢) الإطار -->
    <g id="frame" inkscape:groupmode="layer" inkscape:label="٢ الإطار — Frame">
      <rect x="44" y="44" width="936" height="936" rx="146" class="accent-s" stroke-width="6" opacity=".9"/>
      <rect x="64" y="64" width="896" height="896" rx="128" class="accent-s" stroke-width="2" opacity=".6"/>
    </g>

    <!-- ٣) نموذج الكتاب (استبدله بصورة مصغرة من الغلاف إن شئت: 270×381 تقريباً) -->
    <g id="book" inkscape:groupmode="layer" inkscape:label="٣ نموذج الكتاب — Book mockup" filter="url(#shadow)">
      <rect x="377" y="132" width="270" height="381" rx="10" class="base"/>
      <rect x="377" y="132" width="270" height="381" rx="10" fill="url(#light)"/>
      <rect x="395" y="150" width="234" height="345" rx="4" class="accent-s" stroke-width="5"/>
      <rect x="405" y="160" width="214" height="325" rx="2" class="accent-s" stroke-width="1.6"/>
      <path d="M0,-34 L9,-13 L32,-14 L15,2 L24,24 L0,12 L-24,24 L-15,2 L-32,-14 L-9,-13Z" transform="translate(512 270) scale(1.15)" class="accent-f"/>
      <rect x="452" y="330" width="120" height="10" rx="5" class="ink" opacity=".9"/>
      <rect x="472" y="352" width="80" height="7" rx="3.5" class="ink" opacity=".6"/>
      <circle cx="512" cy="430" r="26" class="accent-s" stroke-width="4"/>
    </g>

    <!-- ٤) اسم التصميم -->
    <g id="title" inkscape:groupmode="layer" inkscape:label="٤ اسم التصميم — Title">
      <text x="512" y="700" text-anchor="middle" direction="rtl" class="title ink">اسم التصميم</text>
    </g>

    <!-- ٥) دوائر الألوان (لون لكل دائرة) -->
    <g id="swatches" inkscape:groupmode="layer" inkscape:label="٥ دوائر الألوان — Swatches" transform="translate(512 820)">
      <circle cx="-64" cy="0" r="22" class="base" stroke="#f5efe0" stroke-width="4"/>
      <circle cx="0" cy="0" r="22" class="accent-f" stroke="#f5efe0" stroke-width="4"/>
      <circle cx="64" cy="0" r="22" class="ink" stroke="#f5efe0" stroke-width="4"/>
    </g>
  </g>

  <!-- أدلة (مخفية) — أظهرها أثناء التصميم ثم أخفها قبل التصدير -->
  <g id="guides" inkscape:groupmode="layer" inkscape:label="أدلة — Guides (hidden)" style="display:none" fill="none" stroke-width="2">
    <rect width="1024" height="1024" rx="180" stroke="#ff2bb1" stroke-dasharray="10 8"/>
    <rect x="72" y="72" width="880" height="880" rx="120" stroke="#00b3ff" stroke-dasharray="6 6"/>
    <line x1="512" y1="0" x2="512" y2="1024" stroke="#00b3ff" stroke-dasharray="4 8"/>
    <rect x="120" y="610" width="784" height="130" stroke="#22c55e"/>
    <text x="512" y="600" text-anchor="middle" font-size="22" fill="#22c55e" stroke="none" font-family="sans-serif">منطقة اسم التصميم</text>
    <text x="512" y="1000" text-anchor="middle" font-size="22" fill="#00b3ff" stroke="none" font-family="sans-serif">المنطقة الآمنة: 72px من كل حافة · زوايا 180px</text>
  </g>
</svg>
