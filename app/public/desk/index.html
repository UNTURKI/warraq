<!doctype html>
<html lang="ar" dir="rtl" class="wq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورّاق</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/wq.css">
  <link rel="stylesheet" href="/desk/desk.css">
  <link rel="stylesheet" href="/desk/lesson.css">
  <link rel="stylesheet" href="/api/theme.css" id="themeCss">
  <script src="/js/wq.js"></script>
</head>
<!-- هيكل البرنامج (في البرنامج وحده): شريط جانبي بالأبواب الخمسة، وكل باب صفحته في إطار يبقى حياً حين يُترك -->
<body class="shell">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-case" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1.5"/><path d="M3 12h18M6.5 12V5.5M9 12V6.5M12.5 12V5M15 12V7l2.5-1.5L19 12M6 21v-6.5M8.5 21v-5.5M11 21v-6"/></symbol>
      <symbol id="i-bench" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 11h7M9 14h7M9 17h4"/></symbol>
      <symbol id="i-rahl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M3 6.5c3-1.2 6-1.2 9 .6 3-1.8 6-1.8 9-.6V12c-3-1.2-6-1.2-9 .6-3-1.8-6-1.8-9-.6z"/><path d="M12 7.1v5.5M7 21l10-8.2M17 21 7 12.8"/></symbol>
      <symbol id="i-style" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M7 3.5 10.5 7 7 10.5 3.5 7zM17 3.5 20.5 7 17 10.5 13.5 7zM7 13.5l3.5 3.5L7 20.5 3.5 17zM17 13.5l3.5 3.5-3.5 3.5-3.5-3.5z"/></symbol>
      <symbol id="i-cover" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="1.5"/><path d="M8 2.5v19"/><path d="m13.5 8 1 2 2.1.3-1.5 1.5.4 2.1-2-1-1.9 1 .4-2.1-1.5-1.5 2.1-.3z"/></symbol>
      <symbol id="i-tiraz" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M2.5 8.5h19v7h-19z"/><path d="M2.5 12l2.4-2 2.4 2 2.4-2 2.3 2 2.4-2 2.4 2 2.4-2 2.3 2"/><path d="M12 2.8l1.6 1.6L12 6 10.4 4.4zM12 18l1.6 1.6-1.6 1.6-1.6-1.6z"/></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M14.5 4.5 19.5 9.5 9 20H4v-5z"/><path d="M12.5 6.5l5 5M4 20l3.5-3.5"/><path d="M15.5 20H20" /></symbol>
      <symbol id="i-lamp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3c1.6 2 2.2 3.4 0 5.6C9.8 6.4 10.4 5 12 3z"/><path d="M4 13c0-1.2 3.6-2 8-2s8 .8 8 2c0 2.8-3.6 5-8 5s-8-2.2-8-5zM20 13l2-2M9 21h6M12 18v3"/></symbol>
      <symbol id="i-fix" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M20 11.5a8 8 0 1 1-2.6-6.4"/><path d="M20 3.5v4.6h-4.6"/><path d="m8.6 12.2 2.3 2.3 4.6-4.8"/></symbol>
      <symbol id="i-gear"viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.9 1.9M16.6 16.6l1.9 1.9M5.5 18.5l1.9-1.9M16.6 7.4l1.9-1.9"/></symbol>
    </defs>
  </svg>

  <!-- شريط العنوان: الألف (قائمة البرنامج) · ورّاق · الباب أو الكتاب · محفوظ. وأزرار النافذة يرسمها ويندوز فوقه -->
  <header class="tbar" id="tbar">
    <button type="button" class="tb-mark" id="menuBtn" title="قائمة البرنامج (Alt)" aria-label="قائمة البرنامج"><svg viewBox="0 0 40 72" width="11" height="20" aria-hidden="true"><path d="M27.4 5.4 36 0v52.5c0 7.6-2 13.6-5.4 19-1.6-5.8-3.2-11.6-3.2-19z" fill="currentColor"/><g class="lgd"><path d="M12 0l7.07 7.07L12 14.14 4.93 7.07z"/><path d="M12 14.14l7.07 7.07L12 28.28l-7.07-7.07z"/><path d="M12 28.28l7.07 7.07L12 42.42l-7.07-7.07z"/><path d="M12 42.42l7.07 7.07L12 56.56l-7.07-7.07z"/><path d="M12 56.56l7.07 7.07L12 70.7l-7.07-7.07z"/></g></svg></button>
    <b class="tb-name"><span class="wq-word" role="img" aria-label="ورّاق"></span></b>
    <span class="tb-ctx" id="tbCtx"></span>
    <span class="tb-saved" id="tbSaved" hidden></span>
  </header>

  <nav class="side" aria-label="أبواب البرنامج">
    <button type="button" class="door" data-door="khizana" title="الخزانة: ما أخرجتَه وما على المنضدة (Ctrl+1)"><svg><use href="#i-case"/></svg><span>الخزانة</span></button>
    <button type="button" class="door" data-door="bench" title="المِنضدة: إخراج كتاب (Ctrl+2)"><svg><use href="#i-bench"/></svg><span>المِنضدة</span><i class="busy" hidden></i></button>
    <button type="button" class="door" data-door="muharrir" title="المحرِّر: راجع ما فهمه ورّاق من الكتاب وصحّحه (Ctrl+3)"><svg><use href="#i-pen"/></svg><span>المحرِّر</span></button>
    <button type="button" class="door" data-door="rahl" title="الرَّحل: قراءة كتاب PDF والكتابة عليه (Ctrl+4)"><svg><use href="#i-rahl"/></svg><span>الرَّحل</span></button>
    <button type="button" class="door" data-door="styles" title="الأساليب: أساليب الإخراج وبطاقاتها (Ctrl+5)"><svg><use href="#i-style"/></svg><span>الأساليب</span></button>
    <button type="button" class="door" data-door="covers" title="المجلِّد: تصاميم الأغلفة الخارجية (Ctrl+6)"><svg><use href="#i-cover"/></svg><span>المجلِّد</span></button>
    <button type="button" class="door" data-door="tiraz" title="الطِّراز: مودات تغيّر البرنامج — شكله وأصواته وحركته (Ctrl+7)"><svg><use href="#i-tiraz"/></svg><span>الطِّراز</span></button>
    <span class="sp"></span>
    <button type="button" class="door tool" data-lamp aria-pressed="false"><svg><use href="#i-lamp"/></svg><span>السِّراج</span></button>
    <button type="button" class="door tool" id="repairBtn" title="أصلح البرنامج: إن علِق شيءٌ أو اضطربت الواجهة، يعود كل شيء إلى حاله الطبيعي (كتبك وإعداداتك تبقى) — Ctrl+Shift+R"><svg><use href="#i-fix"/></svg><span>إصلاح</span></button>
    <button type="button" class="door tool" id="settingsBtn" title="الإعدادات (Ctrl+,)"><svg><use href="#i-gear"/></svg><span>الإعدادات</span></button>
  </nav>

  <main class="doors" id="doors"></main>

  <footer class="status" role="status">
    <span id="stNet"><i class="dot"></i><b>متصل</b></span>
    <span id="stBench"></span>
    <span id="stScribes">النسّاخ: لا عمل</span>
    <span class="end" id="stVer"></span>
  </footer>

  <script type="module" src="/desk/desk.js"></script>
  <script type="module" src="/desk/palette.js"></script>
</body>
</html>
