<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file:; style-src 'unsafe-inline'; font-src file:; script-src file:">
<title>ورّاق</title>
<!-- prompt() في صفحات ورّاق: Electron لا يعرفه، فهذه نافذته (main.cjs ← warraq:prompt-sync) -->
<style>
  @font-face { font-family: Tajawal; src: url('../app/public/fonts/Tajawal-Regular.woff') format('woff'); font-weight: 400; }
  @font-face { font-family: Tajawal; src: url('../app/public/fonts/Tajawal-Bold.woff') format('woff'); font-weight: 700; }
  :root { --paper: #FBF8F1; --vellum: #F3EFE6; --ink: #2A1D14; --muted: #6C5949; --line: #E4DCCB; --field: #FFFFFF; --rubric: #6B1D2F; --gold: #C5A059; --btn: #6B1D2F; --on: #fff; }
  .night { --paper: #0F1A2B; --vellum: #16243B; --ink: #EDE3CB; --muted: #A9B4C6; --line: #2A3B57; --field: #132037; --rubric: #E2C27A; --gold: #D6B36A; --btn: #E2C27A; --on: #0F1A2B; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--paper); color: var(--ink); font: 14px/1.6 Tajawal, 'Segoe UI', Tahoma, sans-serif; border: 1px solid var(--line); overflow: hidden; user-select: none; }
  header { display: flex; align-items: center; gap: 8px; padding: 9px 14px; background: var(--vellum); border-bottom: 1px solid var(--line); -webkit-app-region: drag; app-region: drag; font-size: 12.5px; color: var(--muted); }
  header i { width: 8px; height: 8px; background: var(--gold); transform: rotate(45deg); }
  header b { color: var(--rubric); font-size: 14px; }
  form { display: grid; gap: 10px; align-content: start; padding: 14px 18px 0; min-height: 0; }
  label { font-weight: 700; white-space: pre-wrap; overflow: auto; max-height: 4.8em; }
  input { font: inherit; font-size: 15px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: var(--ink); user-select: text; outline: none; }
  input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 28%, transparent); }
  footer { display: flex; justify-content: flex-start; gap: 8px; padding: 12px 18px 14px; }
  button { font: inherit; font-weight: 700; padding: 6px 20px; border-radius: 7px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  button.ok { background: var(--btn); border-color: var(--btn); color: var(--on); }
.wq-word { display: inline-block; height: 1.15em; aspect-ratio: 214 / 164; vertical-align: -0.33em; background: currentColor; -webkit-mask: url(waraq-word.png) center / contain no-repeat; mask: url(waraq-word.png) center / contain no-repeat; }
</style>
</head>
<body>
<header><i></i><b><span class="wq-word" role="img" aria-label="ورّاق"></span></b></header>
<form id="f"><label for="v" id="m"></label><input id="v" type="text" dir="auto" autocomplete="off" spellcheck="false"></form>
<footer><button type="submit" form="f" class="ok">موافق</button><button type="button" id="no">إلغاء</button></footer>
<script src="prompt.js"></script>
</body>
</html>
