  <g>
    <rect x="232" y="136" width="130" height="122" rx="5" fill="#FBF8F1" stroke="#C5A059" stroke-width="1.4"/>
    <rect x="262" y="148" width="70" height="9" rx="4.5" fill="#6B1D2F"/>
    <path d="M283 164h28" stroke="#C5A059" stroke-width="1.6"/>
    <g fill="#cfc4ae"><rect x="246" y="174" width="102" height="5" rx="2.5"/><rect x="246" y="186" width="102" height="5" rx="2.5"/><rect x="262" y="198" width="86" height="5" rx="2.5"/><rect x="246" y="210" width="102" height="5" rx="2.5"/><rect x="246" y="222" width="102" height="5" rx="2.5"/></g>
    <rect x="300" y="198" width="34" height="5" rx="2.5" fill="#8B1A1A"/>
    <path d="M290 240h14M276 240h6M312 240h6" stroke="#C5A059" stroke-width="2.4" stroke-linecap="round"/>
